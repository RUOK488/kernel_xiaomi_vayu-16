name: Build SukiSU Kernel for POCO X3 Pro

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build cache'
        required: false
        default: 'false'

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Clean workspace if requested
      if: github.event.inputs.clean_build == 'true'
      run: sudo rm -rf ${{ github.workspace }}/*

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14

    - name: Clone kernel source
      run: |
        git clone https://github.com/Jebaitedneko/android_kernel_xiaomi_vayu -b caf --depth=1 kernel
        cd kernel
        echo "Kernel source cloned successfully"

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        echo "SukiSU integrated"

    - name: Configure kernel
      run: |
        cd kernel
        make vayu_defconfig
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --enable CONFIG_KPM
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_DEBUG_KERNEL
        echo "Kernel configured"

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14 \
          OBJDUMP=llvm-objdump-14 \
          STRIP=llvm-strip-14
        echo "Build completed"

    - name: Locate kernel image
      id: locate
      run: |
        cd kernel
        echo "Searching for kernel image..."
        
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "image=arch/arm64/boot/Image.gz-dtb" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Image found: Image.gz-dtb"
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "image=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Image found: Image"
        elif [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "image=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Image found: Image.gz"
        else
          echo "found=false" >> $GITHUB_OUTPUT
          echo "No kernel image found!"
          find arch/arm64/boot -name "Image*" -o -name "*.dtb" 2>/dev/null || true
          exit 1
        fi

    - name: Package with AnyKernel3
      if: steps.locate.outputs.found == 'true'
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp kernel/${{ steps.locate.outputs.image }} AnyKernel3/Image.gz-dtb
        cd AnyKernel3
        KERNEL_NAME="SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip"
        zip -r9 "$KERNEL_NAME" . -x ".git*" "*.zip"
        echo "ZIP_NAME=$KERNEL_NAME" >> $GITHUB_ENV
        echo "Package created: $KERNEL_NAME"

    - name: Upload kernel zip
      if: steps.locate.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_POCO_X3_Pro
        path: AnyKernel3/*.zip
        retention-days: 7

    - name: Upload boot image (fallback)
      if: steps.locate.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Boot_Image_Raw
        path: kernel/${{ steps.locate.outputs.image }}
        retention-days: 7

    - name: Build failed notification
      if: failure()
      run: |
        echo "::error::Build failed. Check logs above."
        exit 1
