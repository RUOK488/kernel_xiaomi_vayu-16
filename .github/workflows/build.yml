name: Build Stock Kernel with SukiSU Ultra

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14

    - name: Clone Xiaomi stock kernel for POCO X3 Pro (vayu)
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b vayu-q-oss --depth=1 kernel
        cd kernel
        echo "✓ Stock kernel cloned"
        echo "Available defconfigs:"
        find arch/arm64/configs -name "*.config" 2>/dev/null | head -10

    - name: Find correct defconfig
      id: defconfig
      run: |
        cd kernel
        if [ -f "arch/arm64/configs/vayu_defconfig" ]; then
          echo "NAME=vayu_defconfig" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/configs/vendor/vayu_defconfig" ]; then
          echo "NAME=vendor/vayu_defconfig" >> $GITHUB_OUTPUT
        else
          # Find any config with vayu in name
          CONFIG=$(find arch/arm64/configs -name "*vayu*" -type f | head -1 | xargs basename | sed 's/.config//')
          if [ -n "$CONFIG" ]; then
            echo "NAME=$CONFIG" >> $GITHUB_OUTPUT
          else
            echo "NAME=defconfig" >> $GITHUB_OUTPUT
          fi
        fi
        echo "Using defconfig: ${{ steps.defconfig.outputs.NAME }}"

    - name: Integrate SukiSU Ultra only (no SUSFS)
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git
        echo "✓ SukiSU Ultra integrated"

    - name: Configure kernel
      run: |
        cd kernel
        make ${{ steps.defconfig.outputs.NAME }}
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --disable CONFIG_DEBUG_INFO
        echo "✓ Kernel configured"

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14
        echo "✓ Build completed"

    - name: Find kernel image
      id: image
      run: |
        cd kernel
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "PATH=arch/arm64/boot/Image.gz-dtb" >> $GITHUB_OUTPUT
          echo "✓ Found Image.gz-dtb"
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "PATH=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          echo "✓ Found Image"
        else
          echo "Searching for any kernel image..."
          find arch/arm64/boot -name "Image*" -type f 2>/dev/null | cat
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp kernel/${{ steps.image.outputs.PATH }} AnyKernel3/Image.gz-dtb
        cd AnyKernel3
        ZIP_NAME="Stock_SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip"
        zip -r9 "$ZIP_NAME" . -x ".git*" "*.zip"
        echo "✓ Package created: $ZIP_NAME"

    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: Stock_SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
        retention-days: 7

    - name: Upload raw kernel image (fallback)
      uses: actions/upload-artifact@v4
      with:
        name: Raw_Kernel_Image
        path: kernel/${{ steps.image.outputs.PATH }}
        retention-days: 7
