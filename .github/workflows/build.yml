name: Build SukiSU Kernel for POCO X3 Pro (tejas101k)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14 python2 lz4
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Clone kernel source (tejas101k/sixteen)
      run: |
        git clone https://github.com/tejas101k/kernel_xiaomi_vayu -b sixteen --depth=1 kernel
        cd kernel
        test -f arch/arm64/configs/vayu_defconfig

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure kernel
      run: |
        cd kernel
        make vayu_defconfig
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG

    - name: Build kernel (with fallback for dtbo)
      run: |
        cd kernel
        # Build the kernel image, ignoring dtbo.img failure
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14 \
          V=1 || true
        # Force build of Image.gz-dtb
        make Image.gz-dtb
        # If that fails, try to find any image
        if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "Image.gz-dtb not found, searching..."
          find arch/arm64/boot -name "Image*"
          exit 1
        fi

    - name: Package kernel
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
        retention-days: 7
