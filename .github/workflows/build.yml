name: Build Stock Kernel + SukiSU Ultra (POCO X3 Pro)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu clang-14 lld-14 llvm-14

    - name: Checkout your kernel source
      run: |
        git clone https://github.com/RUOK488/kernel_xiaomi_vayu-16 -b sixteen --depth=1 kernel
        cd kernel
        test -f arch/arm64/configs/vayu_defconfig && echo "✓ vayu_defconfig found" || (echo "✗ Not found" && exit 1)

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure kernel
      run: |
        cd kernel
        make vayu_defconfig
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14

    - name: Locate kernel image
      run: |
        cd kernel
        cp arch/arm64/boot/Image.gz-dtb ../Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 "SukiSU_Stock_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Stock_vayu
        path: AnyKernel3/*.zip
        retention-days: 7
