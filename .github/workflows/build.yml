name: Build SukiSU Kernel for lybdroid vayu

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev libelf-dev \
            build-essential lzop cpio device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14

      - name: Checkout kernel source
        run: |
          git clone https://github.com/lybdroid/kernel_xiaomi_vayu -b eleven --depth=1 kernel
          cd kernel
          if [ ! -f arch/arm64/configs/vayu_defconfig ]; then
            echo "Error: vayu_defconfig not found!"
            exit 1
          fi

      - name: Integrate SukiSU Ultra
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          rm -rf KernelSU/.git

      - name: Configure the kernel
        run: |
          cd kernel
          make vayu_defconfig
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --disable CONFIG_HID_TRACE
          scripts/config --disable CONFIG_HID_DEBUG

      - name: Build the kernel
        run: |
          cd kernel
          make -j$(nproc) \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14

      - name: Locate kernel image
        id: find
        run: |
          cd kernel
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "IMAGE_PATH=arch/arm64/boot/Image.gz-dtb" >> $GITHUB_OUTPUT
          elif [ -f arch/arm64/boot/Image ]; then
            echo "IMAGE_PATH=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No kernel image found!"
            exit 1
          fi

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          cp kernel/${{ steps.find.outputs.IMAGE_PATH }} AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          zip -r9 "SukiSU_lybdroid_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"
          echo "ZIP_FILE=$(ls *.zip)" >> $GITHUB_ENV

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Kernel_lybdroid_vayu
          path: AnyKernel3/*.zip
          retention-days: 7
