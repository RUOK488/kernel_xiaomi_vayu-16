name: Build Kernel with SukiSU Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Clone working kernel source
      run: |
        git clone https://github.com/Jebaitedneko/android_kernel_xiaomi_vayu -b caf --depth=1 kernel
        cd kernel

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang-14 lld-14

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

    - name: Configure kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE="aarch64-linux-gnu-"
        export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
        make vayu_defconfig
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --enable CONFIG_KPM
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG

    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE="aarch64-linux-gnu-"
        export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
        make -j$(nproc) CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14

    - name: Verify kernel image exists
      run: |
        ls -la kernel/arch/arm64/boot/
        if [ -f kernel/arch/arm64/boot/Image.gz-dtb ]; then
          echo "Kernel image found"
        elif [ -f kernel/arch/arm64/boot/Image ]; then
          echo "Using Image instead"
          cp kernel/arch/arm64/boot/Image kernel/arch/arm64/boot/Image.gz-dtb
        else
          echo "No kernel image found!"
          exit 1
        fi

    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M).zip" * -x ".git*"
        ls -la *.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
