name: Build SukiSU Kernel for POCO X3 Pro

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14

    - name: Clone kernel source (lybdroid - confirmed working)
      run: |
        git clone https://github.com/lybdroid/kernel_xiaomi_vayu -b twelve --depth=1 kernel
        cd kernel
        echo "Checking for defconfig..."
        ls arch/arm64/configs/ | grep -i vayu || echo "No vayu defconfig found"

    - name: If no vayu_defconfig, find alternative
      id: find_config
      run: |
        cd kernel
        CONFIG_FILE=$(find arch/arm64/configs -name "*vayu*" -type f | head -1)
        if [ -n "$CONFIG_FILE" ]; then
          CONFIG_NAME=$(basename "$CONFIG_FILE" .config)
          echo "CONFIG_NAME=$CONFIG_NAME" >> $GITHUB_OUTPUT
          echo "Found config: $CONFIG_NAME"
        else
          echo "CONFIG_NAME=defconfig" >> $GITHUB_OUTPUT
          echo "No vayu config found, using defconfig"
        fi

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure kernel
      run: |
        cd kernel
        make ${{ steps.find_config.outputs.CONFIG_NAME }}
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --enable CONFIG_KPM
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG
        scripts/config --disable CONFIG_DEBUG_INFO

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14

    - name: Find kernel image
      id: find_image
      run: |
        cd kernel
        echo "Searching for kernel image..."
        find arch/arm64/boot -type f -name "Image*" 2>/dev/null | cat
        
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "IMAGE_PATH=arch/arm64/boot/Image.gz-dtb" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "IMAGE_PATH=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "IMAGE_PATH=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
        else
          echo "No kernel image found"
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp kernel/${{ steps.find_image.outputs.IMAGE_PATH }} AnyKernel3/Image.gz-dtb
        cd AnyKernel3
        ZIP_NAME="SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip"
        zip -r9 "$ZIP_NAME" . -x ".git*" "*.zip"
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
        retention-days: 7
