name: Build SukiSU Kernel for POCO X3 Pro (Jebaitedneko)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Install dependencies (including python2 for dtb)
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14 python2 lz4
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Clone Jebaitedneko kernel (has vayu_defconfig)
      run: |
        git clone https://github.com/Jebaitedneko/android_kernel_xiaomi_vayu -b caf --depth=1 kernel
        cd kernel
        if [ ! -f arch/arm64/configs/vayu_defconfig ]; then
          echo "ERROR: vayu_defconfig not found"
          exit 1
        fi

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure kernel
      run: |
        cd kernel
        make vayu_defconfig
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14 \
          OBJDUMP=llvm-objdump-14

    - name: Locate kernel image (any format)
      id: find
      run: |
        cd kernel
        echo "Contents of arch/arm64/boot:"
        ls -la arch/arm64/boot/ || true
        # Search for any kernel image
        IMG=$(find arch/arm64/boot -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" -o -name "zImage" -o -name "Image.lz4" \) | head -1)
        if [ -n "$IMG" ]; then
          cp "$IMG" ../Image.gz-dtb
          echo "Copied $IMG to Image.gz-dtb"
        else
          echo "ERROR: No kernel image found"
          find arch/arm64/boot -type f
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
        retention-days: 7
