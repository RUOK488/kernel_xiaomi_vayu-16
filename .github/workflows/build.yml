name: Build SukiSU Kernel for POCO X3 Pro

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14

    - name: Clone kernel source (tejas101k - confirmed working)
      run: |
        git clone https://github.com/tejas101k/kernel_xiaomi_vayu -b sixteen --depth=1 kernel
        cd kernel
        git log -1 --oneline

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        # Remove nested git to avoid submodule issues
        rm -rf KernelSU/.git

    - name: Configure kernel
      run: |
        cd kernel
        make vayu_defconfig
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --enable CONFIG_KPM
        scripts/config --disable CONFIG_HID_TRACE
        scripts/config --disable CONFIG_HID_DEBUG
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_DEBUG_KERNEL

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14 \
          OBJDUMP=llvm-objdump-14 \
          STRIP=llvm-strip-14

    - name: Find any kernel image
      id: find
      run: |
        cd kernel
        echo "Listing all possible kernel images:"
        find arch/arm64/boot -type f -name "Image*" -o -name "*.dtb" 2>/dev/null | cat
        
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "IMAGE_PATH=arch/arm64/boot/Image.gz-dtb" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=Image.gz-dtb" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "IMAGE_PATH=arch/arm64/boot/Image.gz" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=Image.gz" >> $GITHUB_OUTPUT
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "IMAGE_PATH=arch/arm64/boot/Image" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=Image" >> $GITHUB_OUTPUT
        else
          echo "No kernel image found. Build failed."
          exit 1
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp kernel/${{ steps.find.outputs.IMAGE_PATH }} AnyKernel3/Image.gz-dtb
        cd AnyKernel3
        ZIP_NAME="SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip"
        zip -r9 "$ZIP_NAME" . -x ".git*" "*.zip"
        echo "Created: $ZIP_NAME"
        echo "ZIP_PATH=AnyKernel3/$ZIP_NAME" >> $GITHUB_OUTPUT

    - name: Upload final kernel
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_POCO_X3_Pro_$(date +%Y%m%d)
        path: AnyKernel3/*.zip
        retention-days: 7

    - name: Upload raw boot image
      uses: actions/upload-artifact@v4
      with:
        name: Raw_Boot_Image
        path: kernel/${{ steps.find.outputs.IMAGE_PATH }}
        retention-days: 7
